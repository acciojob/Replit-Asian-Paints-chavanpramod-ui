<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Replit Asian Paints</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<!-- Inputs & Control Buttons -->
	<div class="controls">
		<input type="number" id="block_id" placeholder="Block ID (1-9)" min="1" max="9">
		<input type="text" id="colour_id" placeholder="Color name or hex">
		<button id="change_button">Change Color</button>
		<button id="Reset">Reset</button>
	</div>

	<!-- 3x3 Grid Container -->
	<div id="grid-container">
		<div id="1" class="grid-item">1</div>
		<div id="2" class="grid-item">2</div>
		<div id="3" class="grid-item">3</div>
		<div id="4" class="grid-item">4</div>
		<div id="5" class="grid-item">5</div>
		<div id="6" class="grid-item">6</div>
		<div id="7" class="grid-item">7</div>
		<div id="8" class="grid-item">8</div>
		<div id="9" class="grid-item">9</div>
	</div>

	<script type="text/javascript" src="./script.js"></script>
</body>
</html>
